[build]
builder = "nixpacks"
buildCommand = "npm install && chmod +x ./node_modules/.bin/* && npm run build"

[deploy]
preDeployCommand = "chmod +x ./node_modules/.bin/* && npx prisma db push --accept-data-loss"
startCommand = "node dist/index.js"
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "on_failure"
